name: Deploy API to Cloud Run

# main'ga apps/api yoki packages/database o'zgarsa, avtomatik Cloud Run'ga deploy
# qiladi (Cloud Shell'da qo'lda bash deploy-cloudrun.sh ishlatishga o'rin qoldirmaydi).
# Auth — Workload Identity Federation (kalitsiz; org policy JSON kalit yaratishni
# bloklagani uchun). Kerakli repo secret: CLOUDRUN_ENV_YAML (cloudrun-env.yaml
# fayl tarkibi, butunligicha).

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-cloudrun
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  PROJECT: project-289028d3-984c-4d84-bd4
  REGION: europe-west1
  SERVICE: assetflow-api
  REPO: assetflow
  WIF_PROVIDER: projects/331762958776/locations/global/workloadIdentityPools/github-pool/providers/github-provider
  WIF_SERVICE_ACCOUNT: github-deployer@project-289028d3-984c-4d84-bd4.iam.gserviceaccount.com
  # 2026-07-31 — baza Neon'dan Google Cloud SQL'ga ko'chdi (Neon bepul compute kvotasi tugadi).
  # (Auth Proxy versiyasi va SHA-256 — scripts/cloudsql-proxy.sh ichida, yagona joyda.)
  CLOUDSQL_INSTANCE: project-289028d3-984c-4d84-bd4:europe-west1:frameflow-db

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Auth to GCP
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" -q

      - name: Write cloudrun-env.yaml
        env:
          CLOUDRUN_ENV_YAML: ${{ secrets.CLOUDRUN_ENV_YAML }}
          TOTP_ENC_KEY: ${{ secrets.TOTP_ENC_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$TOTP_ENC_KEY" ]; then
            echo "::error::TOTP_ENC_KEY GitHub secret yo'q — deploy bekor qilindi" >&2
            exit 1
          fi
          printf '%s\n' "$CLOUDRUN_ENV_YAML" > cloudrun-env.yaml
          sed -i '/^TOTP_ENC_KEY:/d' cloudrun-env.yaml
          printf '\nTOTP_ENC_KEY: "%s"\n' "$TOTP_ENC_KEY" >> cloudrun-env.yaml

      # Gate: yangi kod DEPLOY bo'lishidan OLDIN migratsiyalar qo'llanadi. Xato
      # bo'lsa bu qadam yiqiladi → build/push/deploy ISHLAMAYDI → eski (ishlaydigan)
      # revision jonli qoladi (Cloud Run'da preDeploy hook yo'q — gate shu yerda).
      # Migratsiyalar FAQAT additive bo'lgani uchun eski kod yangi sxemani ham tolerat qiladi.
      - name: Setup Node (migration)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Install deps (migration)
        run: npm ci

      - name: Generate Prisma client (migration)
        run: npm run generate -w @creative-tools/database

      # Cloud SQL ko'chishi (2026-07-31): Cloud Run konteynerida `/cloudsql/<INSTANCE>`
      # Unix socket'ini `--add-cloudsql-instances` avtomatik mount qiladi, LEKIN Actions
      # runner'ida bunday mount YO'Q — migratsiya qadami esa jonli bazaga ulanishi shart.
      # Yechim: Auth Proxy runner'da AYNAN shu joylashuvni takrorlaydi (`-u /cloudsql` →
      # `/cloudsql/<INSTANCE>/.s.PGSQL.5432`). Shu sababli CLOUDRUN_ENV_YAML'dagi
      # DATABASE_URL O'ZGARISHSIZ ishlatiladi:
      #   · URL qayta yozilmaydi → maxsus belgili parolni qayta kodlash xatosi YO'Q;
      #   · migratsiya AYNAN production connection string'ini sinaydi (TCP taxminini emas).
      # Sirdagi URL grammatikasi — proxy va migratsiyadan OLDIN (qiymat chop etilmaydi).
      # Kodlanmagan `#`/`?` parolda bo'lsa Prisma faqat "P1013 invalid port number" deydi
      # va bu xato jonli konteynerni ham yiqitadi — sababini shu yerda aniq aytamiz.
      - name: Validate DB URL (qiymatsiz)
        run: |
          set -euo pipefail
          DB_URL="$(grep -E '^DATABASE_URL:' cloudrun-env.yaml | head -1 | sed -E 's/^DATABASE_URL:[[:space:]]*//; s/^"//; s/"[[:space:]]*$//')"
          DIRECT_URL="$(grep -E '^DIRECT_DATABASE_URL:' cloudrun-env.yaml | head -1 | sed -E 's/^DIRECT_DATABASE_URL:[[:space:]]*//; s/^"//; s/"[[:space:]]*$//' || true)"
          node scripts/check-db-url.mjs "$DB_URL" DATABASE_URL
          if [ -n "$DIRECT_URL" ]; then node scripts/check-db-url.mjs "$DIRECT_URL" DIRECT_DATABASE_URL; fi

      - name: Start Cloud SQL Auth Proxy (migratsiya uchun)
        run: |
          set -euo pipefail
          DB_URL="$(grep -E '^DATABASE_URL:' cloudrun-env.yaml | head -1 | sed -E 's/^DATABASE_URL:[[:space:]]*//; s/^"//; s/"[[:space:]]*$//')"
          bash scripts/cloudsql-proxy.sh "$DB_URL"

      - name: Run DB migrations (gated — fail stops deploy)
        run: |
          set -euo pipefail
          # DATABASE_URL'ni deploy env yaml'idan ajratamiz (yagona haqiqat manbai —
          # CLOUDRUN_ENV_YAML secret). Qo'shtirnoqlarni tozalaymiz.
          DB_URL="$(grep -E '^DATABASE_URL:' cloudrun-env.yaml | head -1 | sed -E 's/^DATABASE_URL:[[:space:]]*//; s/^"//; s/"[[:space:]]*$//')"
          if [ -z "$DB_URL" ]; then
            echo "::error::DATABASE_URL cloudrun-env.yaml'da topilmadi — migratsiya bekor qilindi" >&2
            exit 1
          fi
          export DATABASE_URL="$DB_URL"
          # P8 #2 — migratsiya DIRECT (poolsiz) endpoint'dan yurishi kerak. Cloud SQL'da
          # ikkala URL bir xil Unix socket'ga qaraydi (pgbouncer yo'q), lekin fallback
          # saqlanadi — pooler qaytib kelsa kontrakt buzilmaydi.
          # `|| true` SHART: DIRECT_DATABASE_URL yaml'da yo'q bo'lsa grep exit 1 qaytaradi va
          # `set -euo pipefail` butun bosqichni o'ldiradi (fallback'gacha yetib bormaydi).
          DIRECT_URL="$(grep -E '^DIRECT_DATABASE_URL:' cloudrun-env.yaml | head -1 | sed -E 's/^DIRECT_DATABASE_URL:[[:space:]]*//; s/^"//; s/"[[:space:]]*$//' || true)"
          export DIRECT_DATABASE_URL="${DIRECT_URL:-$DB_URL}"
          # 2026-08-18 birinchi rollout eski faol IngestJob dublikatlari sabab indexda
          # to'xtagan. Faqat AYNAN shu ma'lum failed migration bo'lsa official Prisma
          # resolve ishlaydi; boshqa failed migration topilsa skript fail-closed.
          node scripts/recover-ingest-dedupe-migration.mjs
          npm run migrate:deploy -w @creative-tools/database
          # Ko'chishdan keyingi isbot: yangi bazada BARCHA migratsiya "applied" bo'lsin.
          # Drift yoki qo'llanmagan migratsiya bo'lsa bu yerda yiqilamiz → deploy TO'XTAYDI.
          npm run migrate:status -w @creative-tools/database

      # Proxy o'z ishini bajardi — image build/push/deploy unga muhtoj emas.
      - name: Stop Cloud SQL Auth Proxy
        if: always()
        run: |
          if [ -f cloud-sql-proxy.pid ]; then kill "$(cat cloud-sql-proxy.pid)" 2>/dev/null || true; fi

      - name: Build image
        env:
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          IMG="${REGION}-docker.pkg.dev/${PROJECT}/${REPO}/api"
          docker build --provenance=false -t "$IMG:latest" -t "$IMG:${DEPLOY_SHA}" .

      - name: Push image
        env:
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          IMG="${REGION}-docker.pkg.dev/${PROJECT}/${REPO}/api"
          docker push "$IMG:latest"
          docker push "$IMG:${DEPLOY_SHA}"

      # FAZA 3 (D) — ikki bosqichli health-gated rollout:
      # 1) candidate revision /livez bilan, LEKIN 0% trafikda ko'tariladi;
      # 2) candidate tag URL'da /health (DB+storage) 200 bo'lsagina trafik beriladi.
      # Bog'liqligi buzilgan revision production trafik olmaydi; health javobi logda
      # aniq db/storage sababini ko'rsatadi. Liveness /livez — muzlagan konteyner restart.
      # Rollback tartibi: docs/ROLLBACK-RUNBOOK.md
      # #65 (T5.4) — --concurrency 20: instans 1 CPU / 1Gi va ffmpeg/ingest bir xil
      # protsessda → Cloud Run default 80 parallel so'rov OOM xavfi. 20 × 10 instans = 200.
      - name: Deploy Cloud Run candidate (no traffic)
        env:
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          IMG="${REGION}-docker.pkg.dev/${PROJECT}/${REPO}/api:${DEPLOY_SHA}"
          TAG="candidate-${DEPLOY_SHA:0:12}"
          gcloud run deploy "$SERVICE" --image "$IMG" \
            --region "$REGION" --allow-unauthenticated \
            --no-traffic --tag "$TAG" \
            --no-cpu-throttling --min-instances 1 --max-instances 10 \
            --concurrency 20 \
            --memory 1Gi --cpu 1 --timeout 600 \
            --startup-probe "httpGet.path=/livez,initialDelaySeconds=2,periodSeconds=5,timeoutSeconds=5,failureThreshold=12" \
            --liveness-probe "httpGet.path=/livez,periodSeconds=30,timeoutSeconds=5,failureThreshold=3" \
            --add-cloudsql-instances "$CLOUDSQL_INSTANCE" \
            --env-vars-file cloudrun-env.yaml

      - name: Verify candidate health and promote traffic
        env:
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          FRAMEFLOW_READONLY_EMAIL: ${{ secrets.FRAMEFLOW_READONLY_EMAIL }}
          FRAMEFLOW_READONLY_PASSWORD: ${{ secrets.FRAMEFLOW_READONLY_PASSWORD }}
        run: |
          set -euo pipefail
          TAG="candidate-${DEPLOY_SHA:0:12}"
          gcloud run services describe "$SERVICE" --region "$REGION" \
            --format='json(status.traffic)' > candidate-traffic.json
          CANDIDATE="$(node -e '
            const fs = require("fs");
            const tag = process.argv[1];
            const data = JSON.parse(fs.readFileSync("candidate-traffic.json", "utf8"));
            const row = (data.status?.traffic || []).find((item) => item.tag === tag);
            if (!row?.url || !row?.revisionName) process.exit(2);
            process.stdout.write(`${row.url}\t${row.revisionName}`);
          ' "$TAG")"
          TAG_URL="${CANDIDATE%%$'\t'*}"
          REVISION="${CANDIDATE#*$'\t'}"
          healthy=0
          for attempt in $(seq 1 24); do
            status="$(curl -sS --max-time 20 -o candidate-health.json -w '%{http_code}' \
              "$TAG_URL/health" || true)"
            echo "Candidate health attempt ${attempt}: HTTP ${status}"
            cat candidate-health.json 2>/dev/null || true
            echo
            if [ "$status" = "200" ]; then
              healthy=1
              break
            fi
            sleep 5
          done
          if [ "$healthy" != "1" ]; then
            echo "::error::Candidate /health o'tmadi — production trafik eski revisionda qoldi" >&2
            exit 1
          fi

          # `/health` faqat DB/storage'ni isbotlaydi. 2026-08-20 outage'da u 200 edi,
          # lekin Studio Gen moderatsiya konfiguratsiyasi sabab barcha so'rovlar 503 bo'lgan.
          # Endi candidate trafik olishidan OLDIN plugin auth → model readiness → signed quote
          # va real moderation chaqirig'i zero-spend canary bilan tekshiriladi. Secret yo'q bo'lsa
          # jimgina skip EMAS — deploy fail-closed to'xtaydi.
          if [ -z "$FRAMEFLOW_READONLY_EMAIL" ] || [ -z "$FRAMEFLOW_READONLY_PASSWORD" ]; then
            echo "::error::FRAMEFLOW_READONLY_EMAIL/PASSWORD GitHub secrets yo'q — candidate smoke bajarilmadi" >&2
            exit 1
          fi
          FRAMEFLOW_API_URL="$TAG_URL" npm run verify:gen-production-readonly
          FRAMEFLOW_API_URL="$TAG_URL" npm run verify:gen-production-canary

          gcloud run services update-traffic "$SERVICE" --region "$REGION" \
            --to-revisions "${REVISION}=100"

      - name: Show URL
        run: gcloud run services describe "$SERVICE" --region "$REGION" --format='value(status.url)'
