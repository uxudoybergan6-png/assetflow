<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="assetflow-api" content="https://api.getframeflow.app">
<meta name="google-client-id" content="331762958776-8tengevn9af728qapb9vn4ppl1p77kgr.apps.googleusercontent.com">
<title>FrameFlow — Confirm plugin</title>
<!-- BATCH6 tema: FOUC oldini olish — birinchi bo'yoqdan oldin html[data-theme] o'rnatiladi
     (platform/index.html bilan SINXRON saqla — bir xil ff-theme kaliti) -->
<script>(function(){try{var t=localStorage.getItem('ff-theme');if(t!=='noir'&&t!=='neon'&&t!=='cold'&&t!=='light')t='noir';document.documentElement.setAttribute('data-theme',t);}catch(e){document.documentElement.setAttribute('data-theme','noir');}})();</script>
<script src="/studio/js/studio-config.js"></script>
<script src="/ff-api.js?v=dev"></script>
<script src="https://accounts.google.com/gsi/client?hl=en" async defer></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* ═══════════ BATCH6 · 3-TEMA TOKEN QATLAMI (noir · neon · cold) — manba: docs/mockups/batch6 ═══════════
   platform/index.html token bloki bilan SINXRON (reset-password.html/verify-email.html ham shu blokdan).
   Eski qattiq-kod lime brend rangi olib tashlandi — endi tema tokeni (--accent) yagona rang manbai. */
:root,[data-theme="noir"]{--bg:#0a0a0b;--bg-deep:#050506;--surface:#131316;--surface-2:#1b1b1f;--surface-3:#232329;--text:#fff;--text-2:#d0d0d5;--muted:#a2a2aa;--faint:#85858e;--border:rgba(255,255,255,.12);--accent:#fff;--accent-2:#d7d7dc;--on-accent:#09090a;--accent-soft:rgba(255,255,255,.09);--glow:rgba(255,255,255,.11);--danger:#ff675f;--success:#9be36c;--warning:#f7c967;--grad:linear-gradient(135deg,#fff 0%,#a6a6ae 100%);--shadow:0 28px 80px rgba(0,0,0,.45)}
[data-theme="neon"]{--bg:#050505;--bg-deep:#020202;--surface:#0d0d0e;--surface-2:#151517;--surface-3:#1d1d20;--text:#f8f8f5;--text-2:#d0d1ca;--muted:#a0a39a;--faint:#82867c;--border:rgba(216,255,62,.18);--accent:#d8ff3e;--accent-2:#baf02c;--on-accent:#0a0d02;--accent-soft:rgba(216,255,62,.1);--glow:rgba(216,255,62,.35);--danger:#ff635c;--success:#d8ff3e;--warning:#ffd45c;--grad:linear-gradient(135deg,#d8ff3e 0%,#9fe622 100%);--shadow:0 28px 90px rgba(0,0,0,.6)}
[data-theme="cold"]{--bg:#0b0e14;--bg-deep:#070910;--surface:#10141d;--surface-2:#161b28;--surface-3:#1d2434;--text:#f7f9ff;--text-2:#d1d7e8;--muted:#9da7c0;--faint:#7f8aa4;--border:rgba(124,140,255,.22);--accent:#7c8cff;--accent-2:#4fd8eb;--on-accent:#080b16;--accent-soft:rgba(124,140,255,.12);--glow:rgba(79,216,235,.24);--danger:#ff6c7d;--success:#66e8b3;--warning:#ffc96c;--grad:linear-gradient(135deg,#7c8cff 0%,#4fd8eb 100%);--shadow:0 28px 90px rgba(0,0,0,.5)}
/* D3 — YORUG' variant: Studio (theme.js) `ff-theme=light` yozadi, bu sahifalar esa uni
   `noir`ga majburlab qorong'i qilardi — bitta auth oqimi o'rtasida tema sakrardi.
   Qiymatlar app.css LIGHT THEME blokidan (matn/aksent AA: >=4.5:1 oq sirt ustida). */
[data-theme="light"]{--bg:#f4f5f8;--bg-deep:#eceef3;--surface:#fff;--surface-2:#f8f9fc;--surface-3:#e8ebf2;--text:#12151c;--text-2:#3d4556;--muted:#5f6775;--faint:#6b7385;--border:#dde1ea;--accent:#4d7d22;--accent-2:#3f6a1b;--on-accent:#fff;--accent-soft:rgba(77,125,34,.12);--glow:rgba(77,125,34,.18);--danger:#c0261f;--success:#0f7a4f;--warning:#8a6100;--grad:linear-gradient(135deg,#4d7d22 0%,#3f6a1b 100%);--shadow:0 18px 50px rgba(15,23,42,.12)}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;font-size:14px;line-height:1.5;min-height:100vh}
h1{font-family:"Space Grotesk",sans-serif;letter-spacing:-.035em}
.hidden{display:none!important}
.auth-screen{min-height:100vh}
.auth-form-wrap{display:grid;place-items:center;padding:50px 24px;background:var(--bg);min-height:100vh}
.brand{display:flex;align-items:center;gap:9px;font-size:19px;font-weight:700;font-family:"Space Grotesk",sans-serif;text-decoration:none;white-space:nowrap;color:var(--text)}
.brand-mark{display:grid;place-items:center;width:27px;height:27px;border-radius:8px;background:var(--grad);color:var(--on-accent);font-size:16px}
/* D3 — brend belgisi login.html (app.css .brand-mark) bilan BIR XIL: ilgari bu sahifalarda
   `ϟ` chaqmoq turardi va parol kiritish oqimida boshqa saytga o'tgandek taassurot berardi. */
.brand-mark svg{width:19px;height:19px;stroke:var(--on-accent);stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.kicker{font:600 10px/1 "JetBrains Mono",monospace;letter-spacing:.08em;color:var(--muted);display:inline-block}
.verify-card{width:min(460px,90vw);padding:35px;border:1px solid var(--border);border-radius:18px;background:var(--surface);text-align:center}
.verify-card .mail-icon{width:68px;height:68px;border-radius:50%;display:grid;place-items:center;margin:0 auto 18px;background:var(--accent-soft);color:var(--accent);font-size:26px}
.verify-card h1{font-size:32px;margin:14px 0 10px}
.verify-card>p{color:var(--muted);margin:0}
.field{margin-top:14px;text-align:left}
/* D1 (a11y): 8px label o'qilmas darajada kichik edi -> 10.5px. */
.field label{display:block;font:600 10.5px "JetBrains Mono",monospace;color:var(--muted);letter-spacing:.08em}
/* D1 (a11y): klaviatura fokusi butun sahifada ko'rinadi (tugma/havola/input/theme-cyc). */
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.field input{width:100%;margin-top:6px;border:1px solid var(--border);background:var(--bg);color:var(--text);border-radius:8px;padding:11px;outline:0;font:inherit}
.field input:focus{border-color:var(--accent)}
/* D3 — parolni ko'rsatish/yashirish (login.html `.toggle-pw` naqshi; bu sahifalar
   app.css yuklamaydi, shuning uchun uslub joyida). `input` margin-top:6px bo'lgani
   uchun tugma markazi 3px pastga suriladi. */
.pw-wrap{position:relative}
.pw-wrap input{padding-right:42px}
.pw-wrap .toggle-pw{position:absolute;right:5px;top:calc(50% + 3px);transform:translateY(-50%);display:flex;align-items:center;justify-content:center;width:30px;height:30px;background:transparent;border:0;border-radius:7px;color:var(--muted);cursor:pointer}
.pw-wrap .toggle-pw:hover{background:var(--surface-3);color:var(--text)}
.pw-wrap .toggle-pw:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.pw-wrap .toggle-pw svg{width:18px;height:18px;stroke:currentColor;stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round}
.primary{border:0;border-radius:10px;padding:11px 16px;font-weight:700;font-family:inherit;transition:all .18s ease;background:var(--grad);color:var(--on-accent);box-shadow:0 0 0 1px rgba(255,255,255,.08),0 8px 28px var(--glow);cursor:pointer}
.primary:hover{transform:translateY(-2px);filter:brightness(1.08);box-shadow:0 0 0 1px var(--accent),0 14px 34px var(--glow)}
.primary:disabled{opacity:.5;cursor:not-allowed;transform:none!important;filter:none!important}
.full{width:100%;margin-top:16px}
/* D3 (a11y, #6 qoldig'i): "OR" ajratkichi ham 8px edi — labellar bilan bir bosqichga (10.5px). */
.divider{display:flex;align-items:center;gap:10px;margin:18px 0 2px;color:var(--muted);font:500 10.5px "JetBrains Mono",monospace;letter-spacing:.08em}
.divider i{height:1px;background:var(--border);flex:1}
.auth-error{background:color-mix(in srgb,var(--danger) 12%,transparent);border:1px solid color-mix(in srgb,var(--danger) 32%,transparent);color:var(--danger);border-radius:11px;padding:10px 14px;font-size:13px;margin:14px 0 0;text-align:left}
.refund-line{display:flex;gap:10px;padding:12px;border-radius:9px;background:var(--accent-soft);margin-top:16px;color:var(--text-2);font-size:11px;text-align:left;align-items:flex-start}
.refund-line i{font-size:22px;color:var(--success);font-style:normal;line-height:1}
.refund-line b,.refund-line span>b{display:block;color:var(--text);font-size:13px;margin-bottom:2px}
.account-choice{margin-top:18px;padding:14px;border:1px solid var(--border);border-radius:12px;background:var(--surface-2);text-align:left}
.account-choice p{margin:0 0 10px;color:var(--muted);font-size:13px;word-break:break-word}
.account-choice b{color:var(--text)}
.trouble{margin-top:16px;text-align:left;border-top:1px solid var(--border);padding-top:14px}
.trouble summary{cursor:pointer;color:var(--muted);font-weight:600;text-align:center}
.status-line{margin-top:14px;color:var(--muted);font-size:12px;min-height:18px}
.theme-cyc{position:fixed;top:18px;right:18px;width:34px;height:34px;border-radius:9px;border:1px solid var(--border);background:var(--surface);color:var(--muted);display:grid;place-items:center;cursor:pointer;font-size:15px;z-index:5}
.theme-cyc:hover{color:var(--text);border-color:var(--accent)}
</style>
</head>
<body class="auth-page">
<button class="theme-cyc" type="button" onclick="cycleTheme()" title="Theme" aria-label="Switch theme">◐</button>
<div class="auth-screen"><div class="auth-form-wrap">
  <div style="width:min(460px,90vw)">
    <a class="brand" href="/" style="justify-content:center;margin-bottom:22px"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M6.1 9.6V6.1h3.5"/><path d="M14.4 6.1h3.5v3.5"/><path d="M6.1 14.4v3.5h3.5"/><path d="M14.4 17.9h3.5v-3.5"/><path d="M8.9 12h4.6"/><path d="m13.4 10 2 2-2 2"/></svg></span>FrameFlow</a>
    <div class="verify-card">
      <span class="mail-icon" aria-hidden="true">↧</span>
      <span class="kicker">FRAMEFLOW ADOBE PLUGIN</span>
      <h1>Finish signing in.</h1>
      <p id="deviceIntro">Confirm the account you want to use in After Effects and Premiere Pro.</p>
      <p class="auth-error hidden" id="deviceError" role="alert"></p>
      <div class="account-choice hidden" id="deviceAccountChoice">
        <p>You are already signed in as <b id="deviceAccountEmail"></b>.</p>
        <button type="button" class="primary" style="width:100%" id="deviceSessionBtn">Continue with this account</button>
      </div>
      <div class="divider auth-or"><i></i><span id="deviceOrText">OR CONTINUE WITH GOOGLE</span><i></i></div>
      <div id="deviceGoogleBtn" style="display:flex;justify-content:center;margin-top:12px"></div>
      <p class="status-line" id="deviceStatus">Waiting for account confirmation…</p>
      <details class="trouble" id="deviceTrouble">
        <summary>Having trouble?</summary>
        <div class="field" id="deviceCodeField">
          <label for="deviceCodeInput">SECURE REQUEST CODE</label>
          <input id="deviceCodeInput" type="text" inputmode="latin" autocomplete="off" spellcheck="false"
                 placeholder="Paste the request code from the plugin"
                 style="font-family:'JetBrains Mono',monospace" required>
        </div>
        <form id="devicePasswordForm">
          <div class="field">
            <label for="deviceEmailInput">EMAIL</label>
            <input id="deviceEmailInput" type="email" name="email" autocomplete="username" placeholder="you@email.com" required>
          </div>
          <div class="field">
            <label for="devicePassInput">PASSWORD</label>
            <div class="pw-wrap">
              <input id="devicePassInput" type="password" name="password" autocomplete="current-password" placeholder="Your password" required>
              <button type="button" class="toggle-pw" aria-label="Show password" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg></button>
            </div>
          </div>
          <button type="submit" class="primary full" id="devicePasswordBtn">Sign in with email</button>
        </form>
      </details>
      <div id="deviceDone" class="refund-line hidden">
        <i aria-hidden="true">✓</i>
        <span><b>You're signed in.</b>Return to After Effects or Premiere Pro. <span id="deviceEmail" class="hidden"></span></span>
      </div>
    </div>
  </div>
</div></div>

<script>
/* Minimal tema tsikli — ff-theme kalitini platform bilan bo'lishadi (FOUC yuqorida o'qiydi). */
function cycleTheme(){var o=['noir','neon','cold','light'];var c=document.documentElement.getAttribute('data-theme')||'noir';var n=o[(o.indexOf(c)+1)%o.length];document.documentElement.setAttribute('data-theme',n);try{localStorage.setItem('ff-theme',n);}catch(e){}}
</script>
<script>
(function () {
  const codeEl = document.getElementById("deviceCodeInput");
  const errEl = document.getElementById("deviceError");
  const introEl = document.getElementById("deviceIntro");
  const btnEl = document.getElementById("deviceGoogleBtn");
  const doneEl = document.getElementById("deviceDone");
  const formEl = document.getElementById("devicePasswordForm");
  const orEl = document.querySelector(".auth-or");
  const troubleEl = document.getElementById("deviceTrouble");
  const statusEl = document.getElementById("deviceStatus");
  const choiceEl = document.getElementById("deviceAccountChoice");
  const sessionBtn = document.getElementById("deviceSessionBtn");
  const params = new URLSearchParams(location.hash ? location.hash.slice(1) : location.search);
  let requestId = (params.get("request") || "").toLowerCase().replace(/[^0-9a-f]/g, "");
  let browserState = params.get("state") || "";
  if (requestId) {
    try { history.replaceState(null, "", location.pathname); } catch (_) {}
  }

  function showError(msg) {
    errEl.textContent = msg;
    errEl.classList.remove("hidden");
    if (statusEl) statusEl.textContent = "Sign-in needs your attention.";
  }

  function currentRequest() {
    const manual = (codeEl?.value || "").trim();
    if (manual) {
      try {
        const pastedUrl = new URL(manual);
        requestId = (pastedUrl.searchParams.get("request") || "").toLowerCase().replace(/[^0-9a-f]/g, "");
        browserState = pastedUrl.searchParams.get("state") || "";
      } catch (_) {
        requestId = manual.toLowerCase().replace(/[^0-9a-f]/g, "");
        browserState = "";
      }
    }
    return requestId;
  }

  const apiBase = /^(localhost|127\.0\.0\.1)$/.test(location.hostname)
    ? ""
    : (window.ASSETFLOW_STUDIO && window.ASSETFLOW_STUDIO.apiUrl) || "";
  const pwBtn = document.getElementById("devicePasswordBtn");

  function showConfirmed(email) {
    try { history.replaceState(null, "", location.pathname); } catch (_) {}
    introEl.classList.add("hidden");
    btnEl.classList.add("hidden");
    errEl.classList.add("hidden");
    if (choiceEl) choiceEl.classList.add("hidden");
    if (troubleEl) troubleEl.classList.add("hidden");
    if (statusEl) statusEl.classList.add("hidden");
    if (orEl) orEl.classList.add("hidden");
    document.getElementById("deviceEmail").textContent = email || "";
    doneEl.classList.remove("hidden");
  }

  function requestBody(extra) {
    return Object.assign({ requestId: currentRequest(), state: browserState || undefined }, extra || {});
  }

  if (requestId && codeEl) codeEl.closest(".field")?.classList.add("hidden");
  if (!requestId) {
    if (troubleEl) troubleEl.open = true;
    showError("Paste the secure request code or link shown in the plugin.");
  }

  // Mavjud web sessiyasi: hisobni ko'rsatamiz, lekin foydalanuvchi aniq tasdiqlaydi.
  const webUser = window.FFAPI?.getUser?.();
  const webToken = window.FFAPI?.getToken?.();
  if (webUser && webToken && requestId) {
    document.getElementById("deviceAccountEmail").textContent = webUser.email || webUser.name || "your account";
    choiceEl?.classList.remove("hidden");
    if (document.getElementById("deviceOrText")) document.getElementById("deviceOrText").textContent = "OR USE ANOTHER ACCOUNT";
  }
  sessionBtn?.addEventListener("click", async () => {
    sessionBtn.disabled = true;
    statusEl.textContent = "Confirming your account…";
    try {
      const data = await window.FFAPI.req("/api/plugin/device/confirm-session", {
        method: "POST",
        body: requestBody(),
        idempotent: true,
      });
      showConfirmed(data.email);
    } catch (e) {
      showError(e?.message || "Could not confirm this account");
      sessionBtn.disabled = false;
    }
  });

  // Email/parol — faqat Having trouble? ichidagi ikkilamchi yo'l.
  if (formEl) {
    formEl.addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = document.getElementById("deviceEmailInput").value.trim();
      const password = document.getElementById("devicePassInput").value;
      if (!currentRequest()) { showError("Paste the secure request code shown in the plugin"); return; }
      if (!email || !password) { showError("Enter your email and password"); return; }
      errEl.classList.add("hidden");
      if (pwBtn) { pwBtn.disabled = true; pwBtn.textContent = "Signing in…"; }
      try {
        const r = await fetch(`${apiBase}/api/plugin/device/confirm-password`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(requestBody({ email, password })),
        });
        const data = await r.json().catch(() => ({}));
        if (!r.ok) {
          showError(data.error || "Could not sign in — please try again");
          if (pwBtn) { pwBtn.disabled = false; pwBtn.textContent = "Sign in with email"; }
          return;
        }
        showConfirmed(data.email);
      } catch {
        showError("Network error — check your connection and try again");
        if (pwBtn) { pwBtn.disabled = false; pwBtn.textContent = "Sign in with email"; }
      }
    });
  }

  // ── Google bilan tasdiqlash ───────────────────────────────────────────────
  async function onGoogleCredential(resp) {
    if (!currentRequest()) { showError("Paste the secure request code shown in the plugin"); return; }
    statusEl.textContent = "Confirming your Google account…";
    try {
      const r = await fetch(`${apiBase}/api/plugin/device/confirm`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(requestBody({ credential: resp.credential })),
      });
      const data = await r.json().catch(() => ({}));
      if (!r.ok) {
        showError(data.error || "Could not confirm — please try again");
        return;
      }
      showConfirmed(data.email);
    } catch {
      showError("Network error — check your connection and try again");
    }
  }

  const googleClientId = document.querySelector('meta[name="google-client-id"]')?.getAttribute("content") || "";
  // Google ixtiyoriy — kalit yo'q yoki GIS yuklanmasa, email/parol yo'li ishlaydi.
  if (!googleClientId) {
    btnEl.classList.add("hidden");
    if (orEl) orEl.classList.add("hidden");
    return;
  }

  let googleTries = 0;
  function initGoogleButton() {
    if (!window.google?.accounts?.id) {
      if (googleTries++ > 25) { // ~5s — GIS yuklanmadi (bloklangan/oflayn): email/parolga tayanamiz
        btnEl.classList.add("hidden");
        if (orEl) orEl.classList.add("hidden");
        if (troubleEl) troubleEl.open = true;
        showError("Google sign-in could not load. Use email instead.");
        return;
      }
      setTimeout(initGoogleButton, 200);
      return;
    }
    google.accounts.id.initialize({ client_id: googleClientId, callback: onGoogleCredential });
    // #7/#8: locale 'en' — GIS tugmasi brauzer tiliga qarab tarjima bo'lmasin;
    // filled_black — dark mavzuga mos.
    google.accounts.id.renderButton(btnEl, { theme: "filled_black", size: "large", width: 280, text: "signin_with", locale: "en" });
  }
  initGoogleButton();
})();
</script>
<script>
/* D3 — Show/hide password: har bir `.pw-wrap` ichidagi tugma (faqat input.type). */
(function () {
  document.querySelectorAll('.pw-wrap .toggle-pw').forEach(function (t) {
    var i = t.parentNode.querySelector('input[type="password"]');
    if (!i) return;
    t.addEventListener('click', function () {
      var show = i.type === 'password';
      i.type = show ? 'text' : 'password';
      t.setAttribute('aria-pressed', String(show));
      t.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
    });
  });
})();
</script>
</body>
</html>
